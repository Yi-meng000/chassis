<svg host="65bd71144e" xmlns="http://www.w3.org/2000/svg" style="background: #333333; background-color: light-dark(#333333, #000000); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="132" height="72" viewBox="-0.5 -0.5 132 72" content="&lt;mxfile&gt;&lt;diagram id=&quot;jhH9pCpzjcKFHxNkCEBZ&quot; name=&quot;第 1 页&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
    <defs>
        <filter id="drawio-drop-shadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="blur"/>
            <feOffset in="blur" dx="3" dy="3" result="offsetBlur"/>
            <feFlood flood-color="#3D4574" flood-opacity="0.4" result="offsetColor"/>
            <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur"/>
            <feBlend in="SourceGraphic" in2="offsetBlur"/>
        </filter>
    </defs>
    <rect fill="#333333" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(51, 51, 51), rgb(0, 0, 0));"/>
